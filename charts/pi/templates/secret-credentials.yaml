{{- if not .Values.credentials.existingSecret }}
{{- $hasKey := false }}
{{- range $k, $v := dict "ANTHROPIC_API_KEY" .Values.credentials.anthropicApiKey "OPENAI_API_KEY" .Values.credentials.openaiApiKey "GEMINI_API_KEY" .Values.credentials.geminiApiKey "DEEPSEEK_API_KEY" .Values.credentials.deepseekApiKey "GROQ_API_KEY" .Values.credentials.groqApiKey "OPENROUTER_API_KEY" .Values.credentials.openrouterApiKey }}
  {{- if $v }}{{- $hasKey = true }}{{- end }}
{{- end }}
{{- if or $hasKey .Values.credentials.authJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pi.fullname" . }}-credentials
  labels:
    {{- include "pi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.groqApiKey }}
  GROQ_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.openrouterApiKey }}
  OPENROUTER_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}

{{- if and (not .Values.credentials.authJsonSecret) .Values.credentials.authJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pi.fullname" . }}-auth
  labels:
    {{- include "pi.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth.json: {{ .Values.credentials.authJson | quote }}
{{- end }}