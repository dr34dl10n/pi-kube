# Release workflow for pi-kube.
#
# Two jobs:
#   1. image — builds the slim + full image variants and pushes them to ghcr.io,
#      tagged with the chart appVersion. Triggered on:
#        - pushes of v* tags   -> release: produces :<version> and :<version>-full
#        - pushes to main       -> snapshot: :<version>-<sha> and :<version>-<sha>-full
#      Multi-arch (amd64 + arm64).
#   2. chart — on v* tags, packages the Helm chart and attaches it to the GitHub
#      Release, and (optionally) updates an OCI-based chart registry. The chart
#      packaging step is a placeholder kept minimal until a chart repository is
#      chosen (ghcr OCI chart repo is the natural choice here).
name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read chart versions
        id: chart
        run: |
          ver="$(grep -E '^version:' charts/pi/Chart.yaml | sed -E 's/.*"?([0-9][^"]*)"?$/\1/')"
          appver="$(grep -E '^appVersion:' charts/pi/Chart.yaml | sed -E 's/.*"(.*)".*/\1/')"
          echo "chartversion=$ver"   >> "$GITHUB_OUTPUT"
          echo "appversion=$appver"   >> "$GITHUB_OUTPUT"
          echo "chartVersion=$ver"
          echo "appVersion=$appver"

      - name: Docker login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve tags
        id: tags
        run: |
          owner="$(echo '${{ github.repository }}' | cut -d/ -f1)"
          base="${{ env.REGISTRY }}/${owner}/pi-kube"
          ver="${{ steps.chart.outputs.chartversion }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "slim=${base}:${ver}"       >> "$GITHUB_OUTPUT"
            echo "full=${base}:${ver}-full" >> "$GITHUB_OUTPUT"
            echo "latest=${base}:latest"    >> "$GITHUB_OUTPUT"
          else
            sha="$(echo '${{ github.sha }}' | cut -c1-7)"
            echo "slim=${base}:${ver}-${sha}"       >> "$GITHUB_OUTPUT"
            echo "full=${base}:${ver}-${sha}-full" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push slim
        uses: docker/build-push-action@v6
        with:
          context: charts/pi
          file: charts/pi/docker/Dockerfile.pi
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PI_VERSION=${{ steps.chart.outputs.appversion }}
          tags: |
            ${{ steps.tags.outputs.slim }}
            ${{ steps.tags.outputs.latest }}

      - name: Build & push full
        uses: docker/build-push-action@v6
        with:
          context: charts/pi
          file: charts/pi/docker/Dockerfile.pi
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PI_VERSION=${{ steps.chart.outputs.appversion }}
          tags: ${{ steps.tags.outputs.full }}

  chart:
    # Package and publish the Helm chart on release tags. Kept minimal; switch
    # the OCI push on once a chart repository decision is made.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint --strict charts/pi

      - name: Package chart
        run: |
          ver="$(grep -E '^version:' charts/pi/Chart.yaml | sed -E 's/.*"(.*)".*/\1/')"
          helm package charts/pi --version "$ver" --destination .chart-out

      - name: Upload chart to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .chart-out/*.tgz