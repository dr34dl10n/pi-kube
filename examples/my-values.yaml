## Copy & edit, then: helm install pi ./charts/pi -f my-values.yaml
## Full reference: charts/pi/values.yaml

pi:
  mode: interactive
  securityProfile: permissive   # writable rootfs, non-root, drop ALL caps
  offline: true                  # PI_OFFLINE=1, no runtime self-updates
  #defaultProvider: anthropic
  #defaultModel: claude-sonnet-4-5
  #defaultThinkingLevel: medium

## Auth via /login in the TUI is preferred (writes ~/.pi/agent/auth.json on the PVC).
## Pre-seed only if headless — read-only mount, disables /login.
##   kubectl create secret generic pi-auth --from-file=auth.json=~/.pi/agent/auth.json
#credentials:
#  anthropicApiKey: "sk-ant-..."
#  #existingSecret: pi-creds     # chart-created Secret name
#  authJsonSecret: pi-auth        # key must be `auth.json`; read-only, blocks /login

ingress:
  exposure: wireguard
  ssh:
    enabled: true
    port: 2222
    authorizedKeysSecret: pi-ssh-keys   # key: authorized_keys
  wireguard:
    configSecret: pi-wg                 # key: wg0.conf

  ## Alternatives:
  #exposure: loadbalancer
  #ssh:
  #  authorizedKeysSecret: pi-ssh-keys

  #exposure: none   # kubectl exec only

#persistence:
#  home:       { size: 5Gi }
#  workspace:  { size: 10Gi }
#  localTools: { size: 2Gi }

#resources:
#  limits:     { cpu: "2", memory: 4Gi }
#  requests:   { cpu: "500m", memory: 1Gi }

#image:
#  repository: ghcr.io/dr34dl10n/pi-kube
#  # Empty → resolves to the chart version automatically. Set e.g. "<version>-full"
#  # for the batteries-included image, or "<version>-<sha>" for a main-snapshot.
#  tag: ""
